<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OSRS Companion">
<link rel="manifest" href="./manifest.webmanifest?v=11">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=11">
<title>OSRS Companion</title>
<style>
:root{--bg:#0f130e;--panel:#182016;--panel2:#202a1d;--gold:#d8b557;--text:#f5f1df;--muted:#aab4a2;--line:#364431;--green:#79c982;--red:#e37979}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.wrap{max-width:860px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;color:var(--gold);font-size:22px}.sub{font-size:12px;color:var(--muted)}
main{padding:14px 16px calc(90px + env(safe-area-inset-bottom))}.hero,.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.hero h1{font-size:22px;margin:0 0 4px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}.metric b{display:block;color:var(--gold);font-size:18px}.metric small{font-size:10px}.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0}.toolbar input,.toolbar select{margin:0;flex:1}.toolbar select{padding:11px;border-radius:10px;border:1px solid var(--line);background:#11170f;color:var(--text)}.progress{height:6px;background:#0e120d;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--gold)}@media(max-width:520px){.brand{font-size:20px}.tabs{gap:6px}.tabs button{padding:10px 5px;font-size:13px}.summary{grid-template-columns:repeat(3,1fr)}}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#273421;color:var(--gold);font-size:12px;font-weight:700}
.tabs{display:flex;overflow-x:auto;gap:8px;margin:12px 0;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{min-width:82px;flex:1 0 auto}.tabs button,.refresh{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px;font-weight:800}
.tabs button.active{background:var(--gold);color:#1a160c}.refresh{width:auto;padding:9px 12px}
.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.skill b{display:block;font-size:15px}.lvl{font-size:26px;font-weight:900;color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.badge.ok{background:#172b19}.badge.bad{background:#301b1b}.details{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.details summary{cursor:pointer;color:var(--gold);font-weight:800;font-size:12px}.details p{margin:8px 0 0;line-height:1.45}.wiki{display:inline-block;margin-top:8px;color:var(--gold);font-size:12px;font-weight:800;text-decoration:none}.row:last-child{border-bottom:0}.ok{color:var(--green)}.bad{color:var(--red)}
.error{border-color:#653939;background:#2a1919}.empty{text-align:center;padding:28px;color:var(--muted)}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#11170f;color:var(--text);margin:8px 0 12px}
small{color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap top"><div><div class="brand">OSRS Companion</div><div class="sub" id="statusText">Connecting…</div></div><button class="refresh" onclick="loadData(true)">Refresh</button></div></header>
<main class="wrap">
<div class="hero"><h1 id="playerName">OSRS Player</h1><div class="muted">Last refresh: <span id="lastRefresh">—</span></div><div style="margin-top:8px"><span class="pill">PWA v11</span></div></div>
<div class="summary"><div class="metric"><b id="totalLevel">—</b><small>Total level</small></div><div class="metric"><b id="questCount">—</b><small>Quests complete</small></div><div class="metric"><b id="diaryCount">—</b><small>Diaries complete</small></div></div>
<div class="tabs">
<button class="active" data-tab="skills">Skills</button>
<button data-tab="training">Training</button>
<button data-tab="quests">Quests</button>
<button data-tab="diaries">Diaries</button>
<button data-tab="alchemy">Alchemy</button>
<button data-tab="optimizer">Optimizer</button>
</div>
<section id="skills" class="section active"><div class="toolbar"><input id="skillSearch" placeholder="Search skills…"><select id="skillSort"><option value="default">Default order</option><option value="levelDesc">Highest level</option><option value="levelAsc">Lowest level</option></select></div><div id="skillsGrid" class="grid"></div></section>
<section id="training" class="section"><div id="trainingList"></div></section>
<section id="quests" class="section"><div class="toolbar"><input id="questSearch" placeholder="Search quests…"><select id="questFilter"><option value="all">All quests</option><option value="ready">Ready</option><option value="missing">Missing requirements</option><option value="incomplete">Incomplete</option></select></div><div id="questList"></div></section>
<section id="diaries" class="section"><div class="toolbar"><select id="diaryFilter"><option value="all">All diaries</option><option value="ready">Ready</option><option value="missing">Missing requirements</option><option value="incomplete">Incomplete</option></select></div><div id="diaryList"></div></section>
<section id="alchemy" class="section"><div class="toolbar"><input id="alchSearch" placeholder="Search items…"><select id="alchSort"><option value="profit">Highest profit</option><option value="name">Item name</option></select></div><div id="alchemyList"></div></section>
<section id="optimizer" class="section"><div class="card"><b>Training Optimizer</b><div class="muted" style="margin-top:4px">Compare training methods using your current stats and live sheet data.</div><div class="toolbar"><select id="optSkill"></select><select id="optObjective"><option>Fastest XP/hr</option><option>Best GP/hr</option><option>Lowest GP/XP</option><option>Lowest Total Cost</option><option>Shortest Time</option></select></div><div class="toolbar"><input id="optTarget" type="number" min="2" max="99" value="99" placeholder="Target level"><select id="optLocked"><option value="false">Unlocked only</option><option value="true">Include locked</option></select></div><button class="refresh" id="runOptimizer">Run Optimizer</button></div><div id="optimizerStatus" class="muted"></div><div id="optimizerList"></div></section>
<div id="errorBox"></div>
</main>
<script>
const API="https://script.google.com/macros/s/AKfycbyqhgxawvjA4bu5jk8fPojBIXie5oeO9NAl76dVmVkpGNscozI7eYadnSQVw5JCOkhjbw/exec?action=mobileData";
let appData=null;
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); document.getElementById(b.dataset.tab).classList.add('active');
}));
document.getElementById('questSearch').addEventListener('input',renderQuests);
document.getElementById('questFilter').addEventListener('change',renderQuests);
document.getElementById('diaryFilter').addEventListener('change',renderDiaries);
document.getElementById('alchSearch').addEventListener('input',renderAlchemy);
document.getElementById('alchSort').addEventListener('change',renderAlchemy);
document.getElementById('runOptimizer').addEventListener('click',runOptimizer);
document.getElementById('skillSearch').addEventListener('input',renderSkills);
document.getElementById('skillSort').addEventListener('change',renderSkills);

function fmt(n){return Number(n||0).toLocaleString()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function statusClass(s){s=String(s||'').toLowerCase();return /complete|yes|success|profit|unlocked/.test(s)?'ok':(/incomplete|no|locked|error|missing/.test(s)?'bad':'')}

async function loadData(manual=false){
  const st=document.getElementById('statusText'); const box=document.getElementById('errorBox');
  st.textContent=manual?'Refreshing…':'Connecting…'; box.innerHTML='';
  try{
    const r=await fetch(API+(API.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.ok) throw new Error('Backend returned an error');
    appData=j.data||{};
    render();
    st.textContent='Connected • '+(appData.refreshStatus||'Live data loaded');
  }catch(e){
    st.textContent='Connection failed';
    box.innerHTML='<div class="card error"><b>Live data could not load.</b><div class="muted">'+esc(e.message)+'</div><div class="muted" style="margin-top:8px">Confirm the Apps Script deployment is set to Anyone, then redeploy the existing version.</div></div>';
  }
}

function render(){
  document.getElementById('playerName').textContent=appData.player||'OSRS Player';
  document.getElementById('lastRefresh').textContent=appData.lastRefresh||'—';
  const stats=appData.stats||[];
  const quests=appData.quests||[], diaries=appData.diaries||[];
  document.getElementById('totalLevel').textContent=fmt(stats.reduce((a,x)=>a+Number(x.level||0),0));
  document.getElementById('questCount').textContent=quests.filter(x=>/complete/i.test(String(x.status||''))&&!/incomplete/i.test(String(x.status||''))).length+'/'+quests.length;
  document.getElementById('diaryCount').textContent=diaries.filter(x=>/complete/i.test(String(x.status||''))&&!/incomplete/i.test(String(x.status||''))).length+'/'+diaries.length;
  renderSkills();
  const fastest=appData.fastest||[];
  document.getElementById('trainingList').innerHTML=fastest.length?fastest.map(x=>'<div class="card"><div class="row"><b>'+esc(x.skill)+'</b><span>Lvl '+fmt(x.level)+'</span></div><div class="row"><span>'+esc(x.method||'No method')+'</span><span>'+fmt(x.xpHr)+' XP/hr</span></div>'+(x.nextMethod?'<div class="muted" style="margin-top:8px">Next: '+esc(x.nextMethod)+' at '+fmt(x.nextLevel)+'</div>':'')+'</div>').join(''):'<div class="empty">No training data.</div>';
  renderQuests();
  renderDiaries();
  renderAlchemy();
  populateOptimizerSkills();
}
function renderSkills(){
  let stats=[...((appData&&appData.stats)||[])];
  const term=document.getElementById('skillSearch').value.toLowerCase();
  stats=stats.filter(x=>String(x.skill||'').toLowerCase().includes(term));
  const sort=document.getElementById('skillSort').value;
  if(sort==='levelDesc') stats.sort((a,b)=>Number(b.level)-Number(a.level));
  if(sort==='levelAsc') stats.sort((a,b)=>Number(a.level)-Number(b.level));
  document.getElementById('skillsGrid').innerHTML=stats.length?stats.map(x=>{
    const lvl=Number(x.level||0), pct=Math.max(0,Math.min(100,lvl));
    return '<div class="skill"><b>'+esc(x.skill)+'</b><div class="lvl">'+fmt(lvl)+'</div><small>XP '+fmt(x.xp)+'</small><div class="progress"><i style="width:'+pct+'%"></i></div></div>';
  }).join(''):'<div class="empty">No matching skills.</div>';
}
function matchProgressFilter(x,filter){
  if(filter==='ready') return /ready/i.test(String(x.readiness||''));
  if(filter==='missing') return /missing/i.test(String(x.readiness||''))||String(x.missing||'').trim();
  if(filter==='incomplete') return !/complete/i.test(String(x.status||''))||/incomplete/i.test(String(x.status||''));
  return true;
}
function detailBlock(x){
  const parts=[];
  if(x.missing) parts.push('<p><b>Missing:</b> '+esc(x.missing)+'</p>');
  if(x.prereqs) parts.push('<p><b>Prerequisites:</b> '+esc(x.prereqs)+'</p>');
  if(x.notes) parts.push('<p>'+esc(x.notes)+'</p>');
  if(x.wiki) parts.push('<a class="wiki" href="'+esc(x.wiki)+'" target="_blank" rel="noopener">Open OSRS Wiki ↗</a>');
  return parts.length?'<details class="details"><summary>Requirements & details</summary>'+parts.join('')+'</details>':'';
}
function renderQuests(){
  let q=[...((appData&&appData.quests)||[])]; const term=document.getElementById('questSearch').value.toLowerCase();
  const filter=document.getElementById('questFilter').value;
  q=q.filter(x=>String(x.name||'').toLowerCase().includes(term)&&matchProgressFilter(x,filter));
  document.getElementById('questList').innerHTML=q.length?q.map(x=>'<div class="card"><div class="row"><span><b>'+esc(x.name)+'</b></span><b class="'+statusClass(x.status)+'">'+esc(x.status||'Unknown')+'</b></div><div class="badges"><span class="badge '+statusClass(x.readiness)+'">'+esc(x.readiness||'Readiness unknown')+'</span></div>'+detailBlock(x)+'</div>').join(''):'<div class="empty">No matching quests.</div>';
}
function renderDiaries(){
  let d=[...((appData&&appData.diaries)||[])]; const filter=document.getElementById('diaryFilter').value;
  d=d.filter(x=>matchProgressFilter(x,filter));
  document.getElementById('diaryList').innerHTML=d.length?d.map(x=>'<div class="card"><div class="row"><span><b>'+esc(x.region)+'</b><br><small>'+esc(x.tier)+'</small></span><b class="'+statusClass(x.status)+'">'+esc(x.status||'Unknown')+'</b></div><div class="badges"><span class="badge '+statusClass(x.readiness)+'">'+esc(x.readiness||'Readiness unknown')+'</span></div>'+detailBlock(x)+'</div>').join(''):'<div class="empty">No matching diaries.</div>';
}
function populateOptimizerSkills(){
  const el=document.getElementById('optSkill'); if(!el||el.options.length)return;
  const names=((appData&&appData.stats)||[]).map(x=>x.skill).filter(Boolean);
  el.innerHTML='<option>All Skills</option>'+names.map(x=>'<option>'+esc(x)+'</option>').join('');
}
async function runOptimizer(){
  const btn=document.getElementById('runOptimizer'), st=document.getElementById('optimizerStatus'), list=document.getElementById('optimizerList');
  const base=API.split('?')[0];
  const q=new URLSearchParams({action:'optimizer',skill:document.getElementById('optSkill').value,objective:document.getElementById('optObjective').value,targetLevel:document.getElementById('optTarget').value||99,showLocked:document.getElementById('optLocked').value,_:Date.now()});
  btn.disabled=true; st.textContent='Calculating…'; list.innerHTML='';
  try{
    const r=await fetch(base+'?'+q.toString(),{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json(); if(!j.ok)throw new Error('Optimizer returned an error');
    const rows=j.data||[]; st.textContent=rows.length+' methods ranked';
    list.innerHTML=rows.slice(0,50).map((x,i)=>'<div class="card"><div class="row"><span><b>#'+(i+1)+' '+esc(x.method||'Method')+'</b><br><small>'+esc(x.skill)+' • Req '+fmt(x.req)+'</small></span><b>'+fmt(x.xpHr)+' XP/hr</b></div><div class="badges"><span class="badge '+statusClass(x.status)+'">'+esc(x.status||'')+'</span><span class="badge">'+fmt(x.gpHr)+' GP/hr</span>'+(x.hours!==''&&x.hours!=null?'<span class="badge">'+Number(x.hours).toFixed(1)+' hr to target</span>':'')+'</div>'+(x.notes?'<div class="muted" style="margin-top:8px">'+esc(x.notes)+'</div>':'')+'</div>').join('')||'<div class="empty">No methods match these filters.</div>';
  }catch(e){st.textContent='Optimizer failed: '+e.message;}
  finally{btn.disabled=false}
}
function num(v){return Number(String(v??'').replace(/[^0-9.-]/g,''))||0}
function renderAlchemy(){
  let rows=[...((appData&&appData.highAlchemy)||[])];
  const term=document.getElementById('alchSearch').value.toLowerCase();
  rows=rows.filter(x=>String(x.item||'').toLowerCase().includes(term));
  if(document.getElementById('alchSort').value==='name') rows.sort((a,b)=>String(a.item).localeCompare(String(b.item)));
  else rows.sort((a,b)=>num(b.profit)-num(a.profit));
  document.getElementById('alchemyList').innerHTML=rows.length?rows.slice(0,100).map(x=>'<div class="card"><div class="row"><span><b>'+esc(x.item)+'</b><br><small>Buy '+esc(x.buy||'—')+' • Alch '+esc(x.highAlch||'—')+'</small></span><b class="'+(num(x.profit)>=0?'ok':'bad')+'">'+esc(x.profit||'0')+' gp</b></div><div class="badges"><span class="badge">GE limit '+esc(x.limit||'—')+'</span><span class="badge">Price age '+esc(x.age||'—')+'m</span></div></div>').join(''):'<div class="empty">No High Alchemy data.</div>';
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=11');
loadData(false);
</script>
</body></html>
